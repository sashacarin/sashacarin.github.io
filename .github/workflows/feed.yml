name: Sync RSS feed

on:
  push:
    branches: [main]
    paths:
      - blog.html
      - feed.xml
      - scripts/generate_feed.py

permissions:
  contents: write

jobs:
  sync-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate feed.xml from blog.html
        run: python3 scripts/generate_feed.py

      - name: Commit feed.xml if it changed
        run: |
          if git diff --quiet -- feed.xml; then
            echo "feed.xml already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git commit -m "chore: sync feed.xml from blog.html [skip ci]"
          git push
