<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>collage</title>
<!-- the frame is not a page anyone visits; don't let it ask for a favicon -->
<link rel="icon" href="data:,">
<style>
/* The board behind every page. Embedded as an iframe by the .collage-board
   rule in style.css -- it lives in its own document so the tiles are written
   once instead of once per page.

   Tiles are decoration by default. A tile given an href in the generator
   also carries target="_top", so a click navigates the page rather than this
   frame, and tabindex="-1" to stay out of the host page's tab order -- the
   board is wallpaper, and shouldn't be 300 stops on the way to the nav. */

:root {
  /* minimum tile width; columns stretch from here to divide the width
     evenly, so the step up on wide screens keeps the tiles from turning
     into confetti on a big display */
  --tile: 118px;
  --gap: 7px;
}

@media (min-width: 1600px) { :root { --tile: 140px; } }
@media (min-width: 2200px) { :root { --tile: 168px; } }
@media (min-width: 3000px) { :root { --tile: 200px; } }

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: #141414;
  position: relative;
}

/* The grid is a layer inside the body rather than the body itself, and it is
   deliberately not given a bottom edge -- its height comes from however many
   rows the tiles need. Pin all four sides (or set height:100%) and the auto
   rows divide that height between themselves instead: twenty rows of 38px,
   while aspect-ratio goes on sizing each tile from its column width, so every
   tile overflows its row and lands on top of the ones below it.

   fixed, not absolute: a fixed layer never contributes scrollable overflow,
   so the surplus rows below the fold cannot make this document scroll. An
   overflow:hidden viewport would not be enough on its own -- hidden still
   allows scripted scrolling, and a root clip computes back to hidden when it
   propagates to the viewport. */
.board {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: var(--gap);
  box-sizing: border-box;
  display: grid;
  /* Columns stretch to divide the width evenly; rows take their height from
     the square tiles, so every box stays the same size and stays square. */
  grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr));
  grid-auto-rows: auto;
  /* Belt and braces against the same trap, should the tiles ever stop
     filling a screen. */
  align-content: start;
  gap: var(--gap);
  -webkit-user-select: none;
  user-select: none;
}

.t {
  display: block;
  aspect-ratio: 1 / 1;
  overflow: hidden;
  background: #222;
  cursor: default;
}

a.t {
  cursor: pointer;
}

.t img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: saturate(0.9) brightness(0.78);
  transition: filter 0.18s ease;
}

.t img.contain {
  object-fit: contain;
}

/* linked tiles come up to full brightness under the cursor */
a.t:hover img {
  filter: none;
}
</style>
</head>
