<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>collage</title>
<link rel="icon" href="data:,">
<style>
:root {
  --gap: 7px;
}

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: #141414;
  position: relative;
}


.board {
  position: fixed;
  inset: 0;
  padding: var(--gap);
  box-sizing: border-box;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: var(--gap);
  -webkit-user-select: none;
  user-select: none;
}


.t {
  display: block;
  overflow: hidden;
  background: #222;
  cursor: default;
}

a.t {
  cursor: pointer;
}

.t.blank {
  background: transparent;
}

.t img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: saturate(0.9) brightness(0.78);
  transition: filter 0.18s ease;
}

.t img.contain {
  object-fit: contain;
}

a.t:hover img {
  filter: none;
}
</style>
</head>


<body>
<div class="board">
<div class="t"><img src="assets/collage/chirikov.gif" alt="" draggable="false"></div>
<div class="t"><img src="assets/collage/ortnet.gif" alt="" draggable="false"></div>
<div class="t blank"></div>
<div class="t"><img src="assets/collage/relationship-compass.jpg" alt="" draggable="false"></div>
<div class="t"><img src="assets/collage/qween.jpg" alt="" draggable="false"></div>
<div class="t"><img src="assets/collage/HWAwardForVision.gif" alt="" class="contain" draggable="false"></div>
<div class="t"><img src="assets/collage/laun.gif" alt="" draggable="false"></div>
<div class="t blank"></div>
<div class="t"><img src="assets/collage/ordchaos.gif" alt="" draggable="false"></div>
<div class="t"><img src="assets/collage/PREVIEWHM.jpg" alt="" class="contain" draggable="false"></div>
<div class="t"><img src="assets/collage/interrogate150.jpg" alt="" draggable="false"></div>
<div class="t"><img src="assets/collage/genepool.gif" alt="" draggable="false"></div>
<div class="t"><img src="assets/collage/gusher_1.JPG" alt="" draggable="false"></div>
<div class="t"><img src="assets/collage/lorenz.png" alt="" draggable="false"></div>
<div class="t"><img src="assets/collage/blownaway.jpg" alt="" class="contain" draggable="false"></div>
</div>
</body>
</html>
