<!doctype html>
<html lang="en">

<meta charset="utf-8">
<title>collage</title>
<!-- the frame is not a page anyone visits; don't let it ask for a favicon -->
<link rel="icon" href="data:,">
<style>
/* The board behind every page. Embedded as an iframe by the .collage-board
   rule in style.css -- it lives in its own document so the tiles are written
   once instead of once per page.

   Tiles are decoration by default. A tile given an href in the generator
   also carries target="_top", so a click navigates the page rather than this
   frame, and tabindex="-1" to stay out of the host page's tab order -- the
   board is wallpaper, not a queue of stops on the way to the nav. */

:root {
  --gap: 7px;
}

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  background: #141414;
  position: relative;
}

/* Five columns by three rows, dividing the viewport exactly. Nothing
   overflows and there is no surplus to clip, so unlike an auto-filling board
   this one does want a definite height on all four sides: the rows are 1fr
   each and are meant to share it. Still fixed rather than absolute, so it
   contributes no scrollable overflow to the frame. */
.board {
  position: fixed;
  inset: 0;
  padding: var(--gap);
  box-sizing: border-box;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: var(--gap);
  -webkit-user-select: none;
  user-select: none;
}

/* No aspect-ratio on a tile. At a fixed 5 x 3 the cell decides the shape, and
   a tile that insisted on being square would overflow its row -- which is
   what used to make them stack on each other. Tiles fill their cell, and the
   cell's proportions follow the window's. */
.t {
  display: block;
  overflow: hidden;
  background: #222;
  cursor: default;
}

a.t {
  cursor: pointer;
}

/* an empty cell -- shows the board's backing rather than a tile */
.t.blank {
  background: transparent;
}

.t img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: saturate(0.9) brightness(0.78);
  transition: filter 0.18s ease;
}

.t img.contain {
  object-fit: contain;
}

/* linked tiles come up to full brightness under the cursor */
a.t:hover img {
  filter: none;
}
</style>
</head>
